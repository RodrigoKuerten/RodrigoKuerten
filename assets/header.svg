  <rect width="1200" height="300" fill="#0B1D33"/>
  <rect width="1200" height="4" fill="#2563EB"/>

  <text x="80" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#93C5FD">DESENVOLVEDOR JAVA · FULL STACK</text>

  <text x="80" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1" fill="#F8FAFC">Rodrigo Kuerten</text>

  <text x="80" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#CBD5E1">APIs REST, aplicações web e Android.</text>

